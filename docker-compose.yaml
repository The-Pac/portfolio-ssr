services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: distribution.arsac-baptiste.dev/portfolio-ssr:latest
    container_name: portfolio-ssr

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8080:8080"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s